name: CI - End to End Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Fix executable permissions
      run: chmod +x scripts/*.sh

    - name: Generate TLS + Broker Certs
      run: ./scripts/start_sim.sh --no-up
      shell: bash

    - name: Run integration tests
      run: |
        docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --exit-code-from cli
      shell: bash

    - name: Tear down containers
      if: always()
      run: docker compose down --remove-orphans
